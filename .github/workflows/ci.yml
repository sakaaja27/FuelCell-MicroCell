name: IoT CI

on:
  push:
    branches: [ IoT ]
  pull_request:
    branches: [ IoT ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Required Libraries
        run: |
          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "Mobizt_Firestore" || true

      - name: Download Firebase Arduino Client manually
        run: |
          git clone https://github.com/mobizt/Firebase-ESP-Client.git ~/Arduino/libraries/Firebase-ESP-Client

      - name: Compile Sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32 microcell_iot/microcell_iot.ino

